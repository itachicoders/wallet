[package]
name = "agy-wallet"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
base58-monero = "2.1.0"
base64 = "0.22.1"
bip32 = { version = "0.6.0", features = ["alloc"] }
bip39 = "3.0.0"
bs58 = { version = "0.5.1", features = ["check"] }
chacha20poly1305 = "0.11.0"
crossterm = "0.29.0"
curve25519-dalek = "5.0.0"
ed25519-dalek = "3.0.0"
hex = "0.4.3"
k256 = "0.14.0"
libmonero = "0.1.9"
monero = "0.22.0"
monero-wallet = "0.2.0"
qrcode = { version = "0.14.1", default-features = false }
rand = "0.10.4"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "socks"] }
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sha3 = "0.12.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
webpki-roots = "1.0.12"
zeroize = { version = "1.9.1", features = ["derive"] }
